<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>문플로 · 달의 플로리스트</title>
<style>
  html,body{margin:0;height:100%;background:#2f4a22;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #game{position:absolute;display:block;touch-action:none}
  #loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#f4ecd8;font:700 22px "Noto Sans KR",sans-serif;gap:2vmin;background:#2f4a22 url(img/ui_load_land.jpg) center/cover no-repeat}
  @media (orientation:portrait){#loading{background-image:url(img/ui_load_port.jpg)}}
  #loading:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(20,12,30,.05),rgba(20,12,30,.45))}
  #logo{position:relative;width:min(86vw,62vh,760px);height:auto;filter:drop-shadow(0 6px 14px rgba(30,15,5,.55))}
  #barw{position:relative;width:min(84vw,60vh,620px);aspect-ratio:903/194}
  #barw img{position:absolute;inset:0;width:100%;height:100%}
  #bar1{clip-path:inset(0 100% 0 0)}
  #rem{position:relative;display:none;flex-direction:column;align-items:center;gap:1.4vmin;background:rgba(255,248,234,.95);border:4px solid #9b7148;border-radius:22px;padding:2.4vmin 3vmin;max-width:min(88vw,620px);text-align:center;color:#6e4b28;font:700 max(16px,2.6vmin) "Noto Sans KR",sans-serif}
  #rem button{font:700 max(16px,2.6vmin) "Noto Sans KR",sans-serif;color:#6e4b28;background:#ffe9b0;border:3px solid #c9892f;border-radius:16px;padding:1.2vmin 2.4vmin;width:100%}
  #hint{position:relative;font:600 max(15px,2.2vmin) "Noto Sans KR",sans-serif;color:#fff6dc;text-shadow:0 2px 6px rgba(30,15,5,.8)}
</style>
</head>
<body>
<div id="dbg" style="position:fixed;left:0;right:0;top:0;z-index:99;color:#fff;background:rgba(160,20,20,.85);font:14px monospace;padding:6px 8px;white-space:pre-wrap;display:none;pointer-events:none"></div>
<script>
(function(){
  var d=document.getElementById('dbg'),n=0;
  function show(t){try{n++;if(n<=6){d.style.display='block';d.textContent+=t+'\n';}try{localStorage.setItem('lasterr',(localStorage.getItem('lasterr')||'').slice(-800)+t+'\n');}catch(e){}}catch(e){}}
  window.addEventListener('error',function(e){show('ERR '+e.message+' @'+(e.filename||'').split('/').pop()+':'+e.lineno);});
  window.addEventListener('unhandledrejection',function(e){show('REJ '+(e.reason&&e.reason.message||e.reason));});
  try{var old=localStorage.getItem('lasterr');if(old){d.style.display='block';d.textContent='(지난번 오류)\n'+old;setTimeout(function(){d.style.display='none';},15000);localStorage.removeItem('lasterr');}}catch(e){}
  window.__dbg=show;
})();
</script>
<canvas id="bgfill" width="96" height="96" style="position:fixed;left:-4vmax;top:-4vmax;width:calc(100vw + 8vmax);height:calc(100vh + 8vmax);filter:blur(10px);pointer-events:none"></canvas>
<canvas id="game"></canvas>
<div id="loading"><img id="logo" src="img/ui_logo.png" alt="문플로 · 달의 플로리스트"><div id="barw"><img src="img/ui_bar0.png" alt=""><img id="bar1" src="img/ui_bar1.png" alt=""></div><div id="rem"></div><div id="hint">꽃을 준비하고 있어요</div></div>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/misc.js"></script>
<script src="js/shop.js"></script>
<script src="js/garden.js"></script>
<script src="js/greenhouse.js"></script>
<script src="js/lab.js"></script>
<script src="js/room.js"></script>
<script src="js/health.js"></script>
<script src="js/backup.js"></script>
<script src="js/mailsync.js"></script>
<script src="js/sfx.js"></script>
<script src="js/notify.js"></script>
<script src="js/buddy.js"></script>
<script>
  // 시작할 때: 다른 기기에서 더 최근에 저장한 진행이 있으면 물어봄 (없으면 그냥 시작)
  function askRemote() {
    return new Promise(function (res) {
      return res();   // 확인은 게임 안(backup.js)에서 한 번에 함
      if (!(window.FarmBridge && FarmBridge.checkRemote && FarmBridge.backupStatus)) return res();
      var done = false, orig = window.onFarmRemote;
      function fin() { if (done) return; done = true; window.onFarmRemote = orig; var b = document.getElementById('rem'); if (b) b.style.display = 'none'; res(); }
      setTimeout(function () { var b = document.getElementById('rem'); if (!b || !b.style.display || b.style.display === 'none') fin(); }, 3500);
      window.onFarmRemote = function (text) {
        if (done) return;
        try {
          var R = JSON.parse(text), L = null;
          try { L = JSON.parse((window.FarmBridge.load && FarmBridge.load()) || localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) {}
          if (!R || R.v !== 1 || R.rv !== 2 || R.dev === DEV || (L && L.rv === 2 && (R.ts || 0) <= (L.ts || 0) + 3000)) return fin();
          var d = new Date(R.ts || 0), box = document.getElementById('rem');
          box.innerHTML = '<div>다른 기기에서 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2) + '에 저장한<br>더 최근 진행이 있어요. 불러올까요?</div><button id="remY">불러와서 이어서 하기</button><button id="remN">이 기기 진행 그대로 하기</button>';
          box.style.display = 'flex'; var hh = document.getElementById('hint'); if (hh) hh.style.display = 'none';
          document.getElementById('remY').onclick = function () { window.onFarmRemote = orig; done = true; (window.applyRestore || window.onFarmRestore)(text); };
          document.getElementById('remN').onclick = fin;
        } catch (e) { fin(); }
      };
      try { FarmBridge.checkRemote(); } catch (e) { fin(); }
    });
  }
  loadImages(p => { document.getElementById('bar1').style.clipPath = 'inset(0 ' + (100 - (20 + p * 71)).toFixed(1) + '% 0 0)'; }).then(askRemote).then(start).catch(function(e){window.__dbg('START '+(e&&e.stack||e));});
</script>
</body>
</html>
